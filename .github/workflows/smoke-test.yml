name: smoke-test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    name: Producer/consumer smoke test
    runs-on: ubuntu-24.04

    container:
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain:v3.2.0

    env:
      ZEPHYR_TOOLCHAIN_VARIANT: host
      SMOKE_DURATION_SECONDS: "120"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: app

      - name: Install host build tools, Python tooling, and west
        run: |
          apt-get update
          apt-get install -y \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386 \
            python3-pip \
            python3-venv \
            cmake \
            ninja-build \
            gperf \
            ccache \
            device-tree-compiler \
            wget \
            xz-utils \
            file \
            make \
            gcc \
            g++

          python3 -m venv .venv
          . .venv/bin/activate

          python3 -m pip install --upgrade pip
          python3 -m pip install west

          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Initialize west workspace
        run: |
          export PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH"
          west --version
          cmake --version
          ninja --version
          west init -l app
          west update --narrow -o=--depth=1
          west zephyr-export

      - name: Install Python requirements
        run: |
          . "$GITHUB_WORKSPACE/.venv/bin/activate"

          python3 -m pip install --upgrade pip
          python3 -m pip install --no-cache-dir -r zephyr/scripts/requirements.txt
          python3 -m pip install --no-cache-dir -r nrf/scripts/requirements.txt

      - name: Build application with smoke configuration
        run: |
          export PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH"

          west build \
            -b native_sim \
            -p always \
            -d build/RingBuffer-smoke \
            app \
            -- -DEXTRA_CONF_FILE="$GITHUB_WORKSPACE/app/ci/smoke.conf"

          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "PWD=$(pwd)"

          echo "Top-level build directory:"
          find build/RingBuffer-smoke -maxdepth 3 -type d | sort

          echo "Candidate zephyr.exe files:"
          find build/RingBuffer-smoke -name zephyr.exe -type f -print

      - name: Run and validate smoke test
        shell: bash
        run: |
          set +e

          export PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH"

          ARTIFACT_DIR="smoke-artifacts"
          LOG_FILE="$ARTIFACT_DIR/smoke.log"
          SUMMARY_FILE="$ARTIFACT_DIR/smoke-summary.txt"
          BUILD_INFO_FILE="$ARTIFACT_DIR/build-info.txt"
          EXECUTABLE="$(find build/RingBuffer-smoke -name zephyr.exe -type f | head -n 1)"

          mkdir -p "$ARTIFACT_DIR"

          if [ -z "$EXECUTABLE" ]; then
            echo "FAIL: could not find zephyr.exe under build/RingBuffer-smoke" | tee "$LOG_FILE"
            find build/RingBuffer-smoke -maxdepth 5 -type f | sort | tee -a "$LOG_FILE"
            {
              echo "Smoke test validation summary"
              echo "duration_seconds=$SMOKE_DURATION_SECONDS"
              echo "run_exit_code=not_run"
              echo "validation_status=failed"
              echo "FAIL: could not find zephyr.exe under build/RingBuffer-smoke"
            } > "$SUMMARY_FILE"
            exit 1
          fi

          {
            echo "Smoke test build information"
            echo "commit_sha=$GITHUB_SHA"
            echo "workflow=$GITHUB_WORKFLOW"
            echo "run_id=$GITHUB_RUN_ID"
            echo "duration_seconds=$SMOKE_DURATION_SECONDS"
            echo "executable=$EXECUTABLE"
            echo "build_command=west build -b native_sim -p always -d build/RingBuffer-smoke app -- -DEXTRA_CONF_FILE=$GITHUB_WORKSPACE/app/ci/smoke.conf"
          } > "$BUILD_INFO_FILE"

          timeout "${SMOKE_DURATION_SECONDS}s" "$EXECUTABLE" > "$LOG_FILE" 2>&1
          RUN_STATUS=$?

          producer_count=$(grep -c "Producer: HR=" "$LOG_FILE" || true)
          dropped_count=$(grep -c "Producer: buffer full, dropped oldest sample=" "$LOG_FILE" || true)
          consumer_count=$(grep -c "Consumer: fetched=" "$LOG_FILE" || true)
          ema_count=$(grep -c "EMA=" "$LOG_FILE" || true)

          validation_status="passed"

          {
            echo "Smoke test validation summary"
            echo "duration_seconds=$SMOKE_DURATION_SECONDS"
            echo "run_exit_code=$RUN_STATUS"
            echo "producer_count=$producer_count"
            echo "dropped_sample_count=$dropped_count"
            echo "consumer_count=$consumer_count"
            echo "ema_count=$ema_count"
            echo ""
          } > "$SUMMARY_FILE"

          if [ "$RUN_STATUS" -ne 124 ]; then
            validation_status="failed"
            echo "FAIL: expected timeout exit code 124 because the app runs forever." >> "$SUMMARY_FILE"
          fi

          if ! grep -q "Heart-rate simulation app started" "$LOG_FILE"; then
            validation_status="failed"
            echo "FAIL: missing startup log." >> "$SUMMARY_FILE"
          fi

          if [ "$producer_count" -lt 1 ]; then
            validation_status="failed"
            echo "FAIL: missing producer HR logs." >> "$SUMMARY_FILE"
          fi

          if [ "$dropped_count" -lt 1 ]; then
            validation_status="failed"
            echo "FAIL: missing buffer overflow/drop logs." >> "$SUMMARY_FILE"
          fi

          if [ "$consumer_count" -lt 1 ]; then
            validation_status="failed"
            echo "FAIL: missing consumer fetched logs." >> "$SUMMARY_FILE"
          fi

          if [ "$ema_count" -lt 1 ]; then
            validation_status="failed"
            echo "FAIL: missing EMA logs." >> "$SUMMARY_FILE"
          fi

          echo "validation_status=$validation_status" >> "$SUMMARY_FILE"

          {
            echo "## Producer/consumer smoke test"
            echo ""
            echo "| Field | Value |"
            echo "|---|---:|"
            echo "| Runtime seconds | $SMOKE_DURATION_SECONDS |"
            echo "| Process exit code | $RUN_STATUS |"
            echo "| Producer logs | $producer_count |"
            echo "| Dropped sample logs | $dropped_count |"
            echo "| Consumer fetch logs | $consumer_count |"
            echo "| EMA logs | $ema_count |"
            echo "| Validation | $validation_status |"
            echo ""
            echo "### First 40 log lines"
            echo ""
            echo '```text'
            head -n 40 "$LOG_FILE"
            echo '```'
            echo ""
            echo "### Last 40 log lines"
            echo ""
            echo '```text'
            tail -n 40 "$LOG_FILE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          cat "$SUMMARY_FILE"

          if [ "$validation_status" != "passed" ]; then
            exit 1
          fi

      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-artifacts
          path: smoke-artifacts/
