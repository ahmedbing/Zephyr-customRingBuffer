name: twister-tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:  
  twister-tests:
    name: Twister tests
    runs-on: ubuntu-24.04

    container:
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain:v3.2.0

    env:
      ZEPHYR_TOOLCHAIN_VARIANT: host

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: app

      - name: Install host build tools, Python tooling, and west
        run: |
          apt-get update
          apt-get install -y \
            python3-pip \
            python3-venv \
            cmake \
            ninja-build \
            gperf \
            ccache \
            device-tree-compiler \
            wget \
            xz-utils \
            file \
            make \
            gcc \
            g++ \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386

          python3 -m venv .venv
          . .venv/bin/activate
          python3 -m pip install --upgrade pip
          python3 -m pip install west

          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Initialize west workspace
        run: |
          export PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH"
          west init -l app
          west update --narrow -o=--depth=1
          west zephyr-export

      - name: Install Python requirements
        run: |
          export PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH"
          python3 -m pip install --no-cache-dir -r zephyr/scripts/requirements.txt
          python3 -m pip install --no-cache-dir -r nrf/scripts/requirements.txt

      - name: Run Twister tests
        run: |
          export PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH"

          west twister \
            -T app/tests \
            -p native_sim \
            --outdir twister-out \
            --inline-logs

      - name: Publish Twister summary
        if: always()
        shell: bash
        run: |
          export PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH"

          {
            echo "## Zephyr Twister Test Summary"
            echo ""
            echo "- Test root: \`app/tests\`"
            echo "- Platform: \`native_sim\`"
            echo "- Output directory: \`twister-out\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ! -f twister-out/twister.json ]; then
            {
              echo "❌ \`twister-out/twister.json\` was not created."
              echo ""
              echo "Twister probably failed before generating reports."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python3 <<'PY'
          import json
          import os
          from pathlib import Path
          from collections import Counter

          summary_file = Path(os.environ["GITHUB_STEP_SUMMARY"])
          report_file = Path("twister-out/twister.json")

          def esc(value):
              if value is None:
                  return ""
              return str(value).replace("|", "\\|").replace("\n", " ").strip()

          data = json.loads(report_file.read_text(encoding="utf-8"))
          suites = data.get("testsuites", [])

          counts = Counter(s.get("status", "unknown") for s in suites)
          non_passed = [s for s in suites if s.get("status") != "passed"]

          with summary_file.open("a", encoding="utf-8") as out:
              out.write("### Result counts\n\n")
              out.write("| Status | Count |\n")
              out.write("|---|---:|\n")

              if counts:
                  for status, count in sorted(counts.items()):
                      out.write(f"| {esc(status)} | {count} |\n")
              else:
                  out.write("| unknown | 0 |\n")

              out.write("\n### Non-passed test suites\n\n")
              out.write("| Status | Platform | Test suite | Reason |\n")
              out.write("|---|---|---|---|\n")

              if not non_passed:
                  out.write("| passed | - | All test suites passed | - |\n")
              else:
                  for suite in non_passed[:50]:
                      out.write(
                          f"| {esc(suite.get('status'))} "
                          f"| {esc(suite.get('platform'))} "
                          f"| {esc(suite.get('name'))} "
                          f"| {esc(suite.get('reason'))} |\n"
                      )

                  if len(non_passed) > 50:
                      out.write(
                          f"\nShowing first 50 of {len(non_passed)} non-passed suites. "
                          "Download the artifact for full details.\n"
                      )
          PY

          {
            echo ""
            echo "### Raw Twister report-summary"
            echo ""
            echo '```text'
          } >> "$GITHUB_STEP_SUMMARY"

          west twister \
            -T app/tests \
            -p native_sim \
            --report-summary \
            --outdir twister-out \
            >> "$GITHUB_STEP_SUMMARY" 2>&1 || \
            echo "west twister --report-summary failed, but the table above was generated from twister.json." >> "$GITHUB_STEP_SUMMARY"

          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Twister results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twister-results
          path: twister-out/