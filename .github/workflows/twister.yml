name: twister-tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:  
  twister-tests:
    name: Twister tests
    runs-on: ubuntu-24.04

    container:
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain:v3.2.0

    env:
      ZEPHYR_TOOLCHAIN_VARIANT: host

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: app

      - name: Install host build tools, Python tooling, and west
        run: |
          apt-get update
          apt-get install -y \
            python3-pip \
            python3-venv \
            cmake \
            ninja-build \
            gperf \
            ccache \
            device-tree-compiler \
            wget \
            xz-utils \
            file \
            make \
            gcc \
            g++ \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386

          python3 -m venv .venv
          . .venv/bin/activate
          python3 -m pip install --upgrade pip
          python3 -m pip install west

          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Initialize west workspace
        run: |
          export PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH"
          west init -l app
          west update --narrow -o=--depth=1
          west zephyr-export

      - name: Install Python requirements
        run: |
          export PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH"
          python3 -m pip install --no-cache-dir -r zephyr/scripts/requirements.txt
          python3 -m pip install --no-cache-dir -r nrf/scripts/requirements.txt

      - name: Run Twister tests
        run: |
          export PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH"

          west twister \
            -T app/tests \
            -p native_sim \
            --outdir twister-out \
            --inline-logs

      - name: Upload Twister results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twister-results
          path: twister-out/